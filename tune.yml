name: Nightly Tuning

on:
  schedule:
    # 22:00 UTC lands after the US market close (4pm ET) under both
    # standard and daylight time, with a buffer for data to settle.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python tune.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}

      - name: Save tuned config
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config.json tuning_log.csv
          git diff --cached --quiet || git commit -m "Nightly parameter tuning"
          git pull --rebase
          git push
