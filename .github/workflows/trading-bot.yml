name: Trading Bot

on:
  schedule:
    # Odd minutes on purpose: GitHub is busiest at the top of the hour.
    - cron: "47 12 * * 1-5"   # morning start, waits for the open
    - cron: "7 18 * * 1-5"    # midday start, takes over from the morning run
  workflow_dispatch:

# Never let two bot runs trade at the same time; a second one waits its turn.
concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # safety cap, under GitHub's 6-hour limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
