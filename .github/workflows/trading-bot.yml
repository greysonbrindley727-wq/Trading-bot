name: Trading Bot

on:
  schedule:
    # Every hour, 13:00-21:00 UTC, Mon-Fri.
    # This window covers US market hours (9:30am-4pm ET) across both
    # standard and daylight time, so no DST math needed. The bot itself
    # checks whether the market is open and whether it already traded
    # today, so extra runs outside real trading time are harmless.
    - cron: "0 13-21 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
